<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account - Knowledge Assistant</title>
</head>
<body>
<main>
  <h1>Signed in</h1>
  <p>Username: <strong>{{ username }}</strong></p>
  <p>Role: <strong>{{ role }}</strong></p>

  {% if must_change_password %}
  <p role="alert">Your password appears on a list of compromised passwords. <a href="/change-password">Change it now</a>.</p>
  {% endif %}

  <p><a href="/">Open the Knowledge Assistant</a></p>
  <p><a href="/change-password">Change password</a></p>

  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Sign out</button>
  </form>
</main>
</body>
</html>
