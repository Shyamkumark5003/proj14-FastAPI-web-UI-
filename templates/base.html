<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <h1>{{ page_title }}</h1>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
